spring:
  application:
    name: what2eat
  web:
    resources:
      add-mappings: false
  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        time_zone: UTC
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_ADDRESS}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
kakao:
  rest:
    api:
      key: ${KAKAO_REST_API_KEY}
      url: ${KAKAO_STORE_API_URL}
  redirect_url: ${KAKAO_REDIRECT_URL}

aws:
  s3:
    bucket: ${S3_BUCKET}
    region:
      static: ${S3_REGION}
    cloud-front: ${S3_CLOUD_FRONT_URL}
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}

apple:
  key-id: ${APPLE_KEY_ID}
  client-id: ${APPLE_CLIENT_ID}
  private-key-url: ${APPLE_PRIVATE_KEY_URL}
  public-key-url: ${APPLE_PUBLIC_KEY_URL}
  team-id: ${APPLE_TEAM_ID}

logging:
  level:
    org:
      springframework: DEBUG
app:
  encryption:
    key: ${ENCRYPTION_KEY}
springdoc:
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: index.html # Swagger UI 경로 => localhost:8000/demo-ui.html
  tags-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬*
  operations-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬*