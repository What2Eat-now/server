<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이메일 인증 코드</title>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #f2f2f2; margin: 0; padding: 0; }
    .email-container { max-width: 600px; margin: 40px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
    .header { margin-bottom: 30px; }
    .header h1 { font-size: 24px; color: #333333; }
    .content { font-size: 16px; color: #555555; margin-bottom: 30px; line-height: 1.5; }
    .verification-code { font-size: 32px; font-weight: bold; letter-spacing: 2px; color: #007BFF; margin: 20px 0; }
    .footer { font-size: 12px; color: #999999; }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="header">
      <h1>이메일 인증</h1>
    </div>
    <div class="content">
      <p>아래 인증 코드를 복사하여 회원가입/로그인 화면에 입력해 주세요.</p>
      <div class="verification-code">
        ${verificationCode}
      </div>
      <p>이 코드는 10분 동안 유효합니다.</p>
    </div>
    <div class="footer">
      <p>© 2025 YourCompany. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
